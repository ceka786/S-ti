footer{padding:26px 0 8px;color:var(--slate);font-size:13px;text-align:center}

    ["A krém dermedése","Tedd a krémet hűtőbe, amíg kenhető, de már kellően szilárd nem lesz. Akkor jó, ha a kanál nyoma megmarad benne, és az állaga a puha vajéhoz hasonlít. <b>Legfeljebb 45 percig</b>, különben teljesen megdermed, és kenéskor törni fog.",1500],
    ["A piskótalap kibontása","A teljesen kihűlt piskótát óvatosan tekerd ki, majd fektesd le, és húzd le róla a konyharuhát. Ne próbáld teljesen kisimítani – az enyhe ív nyugodtan megmaradhat.",0],
    ["A lekvár felkenése","A lekvárt melegítsd fel, majd keverd simára. <b>Vékonyan kend el</b> a piskótalapon, és egy ecset segítségével kissé dolgozd bele a piskótába. A két szélén hagyj 2–3 cm-t szabadon. Ne használj túl vastag réteget, mert a lekvár csúszóssá teszi a felületet, és tekerés közben szétnyomódhat a tekercs.",0],
    ["A krém felkenése","Kend a krémet egyenletesen a lekvárra, hátul szintén hagyj 2–3 cm-t szabadon. Ott csupasz piskóta találkozik piskótával és megtapad – különben kinyomódik a krém.",0],
    ["Feltekerés","A hosszabbik oldal felől kezdd el feltekerni. Az első fordulat legyen szoros, majd egyenletes mozdulatokkal folytasd a tekerést, miközben fokozatosan húzd hátra a konyharuhát / sütőpapírt. A tekercs vége <b>alulra</b> kerüljön.",0],

    ["Hűtés","Legalább 3 óra, de inkább egy éjszaka – a zselatin csak kb. 12 óra után éri el a teljes szilárdságát. Csak közvetlenül tálalás előtt szeleteld.",10800]
  ],
  notes:[
    "<strong>Miért nem a krémbe megy a lekvár?</strong> Vizet visz bele, és fellazítja a tölteléket. A lapon viszont puhítja azt – ott még segít is a tekerésnél.",
    "<strong>Nincs eperpor?</strong> Őrölj magad liofilizált (fagyasztva szárított) epret, vagy forralj be 150 g lekvárt a felére, és abból tegyél 3 evőkanállal a krémbe.",
    "<strong>Szállítás melegben:</strong> előtte 30 perc mélyhűtő, aztán hűtőtáskába, hűtőakkukra, közéjük egy konyharuha. Egyben szállítsd, csak a helyszínen vágd fel.",
    "<strong>Berepedt tekerés közben?</strong> Nem tragédia. Hűtés után a legtöbb repedés eltűnik, a maradékot elfedi a porcukor."
  ]
}]
};

let lang="de", r=0, pos=-1;
let tick=null, left=0, running=false;

/* Spirale */
function spiral(turns,r0,r1){
  const pts=[],N=turns*90;
  for(let i=0;i<=N;i++){
    const t=i/N,a=t*turns*2*Math.PI-Math.PI/2,rad=r0+(r1-r0)*t;
    pts.push((50+rad*Math.cos(a)).toFixed(2)+","+(50+rad*Math.sin(a)).toFixed(2));
  }
  return "M"+pts.join("L");
}
const d1=spiral(2.6,6,40), d2=spiral(2.6,10,44);
["sp-track","sp-fill"].forEach(id=>document.getElementById(id).setAttribute("d",d1));
document.getElementById("sp-cream").setAttribute("d",d2);
const fillEl=document.getElementById("sp-fill"), creamEl=document.getElementById("sp-cream");
[fillEl,creamEl].forEach(el=>{const L=el.getTotalLength();el.style.strokeDasharray=L;el.style.strokeDashoffset=L;});
function setSpiral(f){[fillEl,creamEl].forEach(el=>{el.style.strokeDashoffset=el.getTotalLength()*(1-f);});}

/* Timer */
function stopTimer(){if(tick){clearInterval(tick);tick=null;}running=false;}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0");}
function beep(){
  try{
    const C=new (window.AudioContext||window.webkitAudioContext)();
    [0,.28,.56].forEach(o=>{
      const osc=C.createOscillator(),g=C.createGain();
      osc.frequency.value=880;osc.connect(g);g.connect(C.destination);
      g.gain.setValueAtTime(0,C.currentTime+o);
      g.gain.linearRampToValueAtTime(.22,C.currentTime+o+.02);
      g.gain.exponentialRampToValueAtTime(.001,C.currentTime+o+.22);
      osc.start(C.currentTime+o);osc.stop(C.currentTime+o+.24);
    });
  }catch(e){}
  if(navigator.vibrate)navigator.vibrate([180,90,180]);
}
function paintClock(){
  const t=UI[lang], c=document.getElementById("clock"); if(!c)return;
  c.textContent = left>0 ? fmt(left) : t.tDone;
  c.classList.toggle("done",left<=0);
  const b=document.getElementById("t-go");
  if(b) b.textContent = running ? t.tPause : (left>0 ? t.tStart : t.tAgain);
}
function toggleTimer(){
  if(left<=0){left=RECIPES[lang][r].steps[pos][2];running=false;paintClock();return;}
  if(running){stopTimer();}
  else{
    running=true;
    tick=setInterval(()=>{left--;if(left<=0){left=0;stopTimer();beep();}paintClock();},1000);
  }
  paintClock();
}

/* Rendern */
function render(scroll){
  const t=UI[lang], rec=RECIPES[lang][r], v=document.getElementById("view"), total=rec.steps.length;

  document.documentElement.lang = lang;
  document.getElementById("h-eyebrow").textContent=t.eyebrow;
  document.getElementById("h-title").innerHTML=t.title;
  document.getElementById("h-sub").textContent=t.sub;
  document.getElementById("h-foot").textContent=t.foot;
  document.getElementById("tab-0").textContent=t.tabs[0];
  document.getElementById("tab-1").textContent=t.tabs[1];
  document.getElementById("tab-0").setAttribute("aria-selected",r===0);
  document.getElementById("tab-1").setAttribute("aria-selected",r===1);
  document.getElementById("lang-de").setAttribute("aria-pressed",lang==="de");
  document.getElementById("lang-hu").setAttribute("aria-pressed",lang==="hu");

  if(pos<0){
    setSpiral(0);
    document.getElementById("progress-n").textContent=t.ingredients;
    document.getElementById("progress-t").textContent=t.start;
    v.innerHTML='<div class="card"><h2>'+rec.title+'</h2><ul class="ing">'+
      rec.ing.map(i=>'<li><span class="amt">'+i[0]+'</span><span>'+i[1]+
        (i[2]?'<span class="note-inline">'+i[2]+'</span>':'')+'</span></li>').join('')+
      '</ul></div><div class="card notes"><h3>'+t.notes+'</h3>'+
      rec.notes.map(n=>'<p>'+n+'</p>').join('')+'</div>';
  }else{
    const s=rec.steps[pos];
    setSpiral((pos+1)/total);
    document.getElementById("progress-n").textContent=t.step+" "+(pos+1)+" "+t.of+" "+total;
    document.getElementById("progress-t").textContent=rec.title;
    v.innerHTML='<div class="card"><div class="step-head">'+
      '<span class="step-num">'+String(pos+1).padStart(2,"0")+'</span>'+
      '<h2 class="step-title">'+s[0]+'</h2></div>'+
      '<p class="step-body">'+s[1]+'</p>'+
      (s[2]?'<div class="timer"><div class="clock" id="clock"></div><div class="timer-btns">'+
        '<button class="mini go" id="t-go"></button>'+
        '<button class="mini" id="t-reset">'+t.tReset+'</button></div></div>':'')+
      '</div>';
    if(s[2]){
      if(!running){left=s[2];}
      paintClock();
      document.getElementById("t-go").onclick=toggleTimer;
      document.getElementById("t-reset").onclick=()=>{stopTimer();left=s[2];paintClock();};
    }
  }

  const back=document.getElementById("btn-back"), next=document.getElementById("btn-next");
  back.textContent=t.back; back.disabled=pos<0;
  if(pos<0){next.textContent=t.go;next.disabled=false;}
  else if(pos<total-1){next.textContent=t.next;next.disabled=false;}
  else if(r===0){next.textContent=t.toFill;next.disabled=false;}
  else{next.textContent=t.done;next.disabled=true;}

  if(scroll!==false) window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById("btn-next").onclick=()=>{
  stopTimer();
  const total=RECIPES[lang][r].steps.length;
  if(pos<total-1){pos++;} else if(r===0){r=1;pos=-1;}
  render();
};
document.getElementById("btn-back").onclick=()=>{stopTimer();pos--;render();};
document.getElementById("tab-0").onclick=()=>{stopTimer();r=0;pos=-1;render();};
document.getElementById("tab-1").onclick=()=>{stopTimer();r=1;pos=-1;render();};
document.getElementById("lang-de").onclick=()=>{lang="de";render(false);};
document.getElementById("lang-hu").onclick=()=>{lang="hu";render(false);};
document.addEventListener("keydown",e=>{
  const n=document.getElementById("btn-next"), b=document.getElementById("btn-back");
  if(e.key==="ArrowRight"&&!n.disabled)n.click();
  if(e.key==="ArrowLeft"&&!b.disabled)b.click();
});

render(false);
</script>
